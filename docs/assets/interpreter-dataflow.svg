<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img">
  <title>hao-bqn interpreter dataflow</title>
  <desc>Source text to values: UTF-8 lexer, role-aware parser, tree evaluator, primitives and the •hao bridge into the C11 engine, with setjmp-based error handling.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59E1EE"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0CA79"/></marker>
  </defs>
  <rect width="1200" height="820" fill="#080C18"/>
  <text x="600" y="40" font-family="monospace" font-size="22" fill="#EAF0FF" text-anchor="middle" font-weight="bold">hao-bqn — interpreter dataflow</text>
  <rect x="60" y="80" width="260" height="70" rx="8" fill="#171A3A" stroke="#F0CA79" stroke-width="1.5"/>
  <text x="190.0" y="110.2" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle">source</text>
  <text x="190.0" y="130.2" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle">.bqn files · -e · -x</text>
  <rect x="360" y="80" width="360" height="70" rx="8" fill="#171A3A" stroke="#59E1EE" stroke-width="1.5"/>
  <text x="540.0" y="110.2" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle">UTF-8 lexer</text>
  <text x="540.0" y="130.2" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle">TokVec · names · glyphs · ‿ · ¯ e¯ π ∞</text>
  <rect x="760" y="80" width="380" height="70" rx="8" fill="#171A3A" stroke="#59E1EE" stroke-width="1.5"/>
  <text x="950.0" y="110.2" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle">parser  (HNode tree)</text>
  <text x="950.0" y="130.2" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle">roles: subject · function · 1-mod · 2-mod</text>
  <path d="M320 115 H356" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M720 115 H756" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="760" y="200" width="180" height="90" rx="8" fill="#171A3A" stroke="#7659FF" stroke-width="1.5"/>
  <text x="850.0" y="240.4" font-family="monospace" font-size="14" fill="#EAF0FF" text-anchor="middle">HAΩ dialect</text>
  <text x="850.0" y="259.4" font-family="monospace" font-size="11" fill="#8A93B8" text-anchor="middle">math precedence</text>
  <rect x="960" y="200" width="180" height="90" rx="8" fill="#171A3A" stroke="#7659FF" stroke-width="1.5"/>
  <text x="1050.0" y="240.4" font-family="monospace" font-size="14" fill="#EAF0FF" text-anchor="middle">-b strict</text>
  <text x="1050.0" y="259.4" font-family="monospace" font-size="11" fill="#8A93B8" text-anchor="middle">right-to-left BQN</text>
  <path d="M900 150 V196" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M1050 150 V196" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="380" y="200" width="320" height="90" rx="8" fill="#171A3A" stroke="#59E1EE" stroke-width="1.5"/>
  <text x="540.0" y="240.4" font-family="monospace" font-size="14" fill="#EAF0FF" text-anchor="middle">block classification</text>
  <text x="540.0" y="259.4" font-family="monospace" font-size="11" fill="#8A93B8" text-anchor="middle">𝕩/𝕨 blocks vs ⊢ ⊣ ⊤ ⊥ ℓ blocks</text>
  <path d="M756 245 H704" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="340" width="640" height="80" rx="8" fill="#171A3A" stroke="#59E1EE" stroke-width="1.5"/>
  <text x="380.0" y="375.1" font-family="monospace" font-size="16" fill="#EAF0FF" text-anchor="middle">evaluator  hb_eval()</text>
  <text x="380.0" y="396.1" font-family="monospace" font-size="13" fill="#8A93B8" text-anchor="middle">HEnv scopes · assignment ← ↩ ⇐ · ? ◇ guards · trains · derived functions</text>
  <path d="M540 290 V336" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
