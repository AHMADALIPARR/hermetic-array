  <text x="210.0" y="510.2" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle">values  HV</text>
  <text x="210.0" y="530.2" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle">NUM CHAR ARR FN M1 M2</text>
  <rect x="400" y="470" width="300" height="90" rx="8" fill="#171A3A" stroke="#59E1EE" stroke-width="1.5"/>
  <text x="550.0" y="510.2" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle">src/interp_prim.c</text>
  <text x="550.0" y="530.2" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle">BQN primitives + modifiers</text>
  <rect x="740" y="470" width="400" height="90" rx="8" fill="#171A3A" stroke="#7659FF" stroke-width="1.5"/>
  <text x="940.0" y="510.2" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle">HAΩ glyphs</text>
  <text x="940.0" y="530.2" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle">⍡ ⊗ ⊙ ⟂ ↻ ⌁ ⍣  ·  ⌊k⌋ rotation  ·  |x|</text>
  <path d="M210 420 V466" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M550 420 V466" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M704 515 H736" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="400" y="610" width="740" height="80" rx="8" fill="#171A3A" stroke="#6EE7A8" stroke-width="1.5"/>
  <text x="770.0" y="645.2" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle">•hao.* bridge</text>
  <text x="770.0" y="665.2" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle">hv_to_hao → HaoArray → kernel → wrap   (Norm, SphereExp, Evolve, GeoProd, Rotor, Act, …)</text>
  <path d="M550 560 V606" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="400" y="730" width="740" height="60" rx="8" fill="#171A3A" stroke="#6EE7A8" stroke-width="1.5"/>
  <text x="770.0" y="764.9" font-family="monospace" font-size="14" fill="#EAF0FF" text-anchor="middle">src/array.c · src/geom.c · src/array_ext.c · src/geom_ext.c</text>
  <path d="M770 690 V726" fill="none" stroke="#59E1EE" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="610" width="300" height="180" rx="8" fill="#171A3A" stroke="#FF7A8A" stroke-width="1.5"/>
  <text x="210" y="645" font-family="monospace" font-size="15" fill="#EAF0FF" text-anchor="middle" font-weight="normal">errors</text>
  <text x="210" y="675" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle" font-weight="normal">hb_error → longjmp</text>
  <text x="210" y="705" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle" font-weight="normal">caught by ⎊ (•CurrentError)</text>
  <text x="210" y="735" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle" font-weight="normal">or reported by the CLI:</text>
  <text x="210" y="760" font-family="monospace" font-size="12" fill="#8A93B8" text-anchor="middle" font-weight="normal">Error: file:line: message</text>
  <path d="M400 650 H364" fill="none" stroke="#F0CA79" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#g)"/>
</svg>
