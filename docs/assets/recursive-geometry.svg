    <circle cx="550" cy="170" r="83"/>
    <circle cx="920" cy="170" r="83"/>
  </g>
  <g stroke="#59E1EE" stroke-width="2" fill="none">
    <path d="M180 87 L253 208 L107 208 Z"/>
    <path d="M550 87 L630 145 L600 237 L500 237 L470 145 Z"/>
    <path d="M920 87 L996 132 L996 209 L920 253 L844 209 L844 132 Z"/>
