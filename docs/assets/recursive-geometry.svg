  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L9 3 L0 6 Z" fill="#59E1EE"/>
    </marker>
  </defs>
  <g fill="none" stroke="#7659FF" stroke-width="2">
